<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A5178">
<title>Le Piccole Meraviglie del Mare</title>
<style>
:root { color-scheme: dark; --accento: #48CAE4; }
* { box-sizing: border-box; }
body {
  margin: 0; padding: 30px 20px 200px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: #EAF7FB; background: #06283F;
  background-image: linear-gradient(180deg, #E9FAFF 0, #C4E9F8 80px,
      #4FC3E8 190px, #17709F 42%, #0A5178 68%, #06283F 100%);
  background-attachment: fixed;
  display: flex; flex-direction: column; align-items: center;
  min-height: 100vh; text-align: center;
}
body::before {
  content: ""; position: fixed; top: -90px; left: 50%; margin-left: -150px;
  width: 300px; height: 300px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, #FFF6CE 0%, #FFE79A 34%,
                              rgba(255,231,154,0) 70%);
}
.scafo { position: relative; z-index: 1; width: 100%; max-width: 33em;
         display: flex; flex-direction: column; align-items: center; }
.capitolo { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase;
            font-weight: 700; color: var(--accento); margin: 0 0 12px; }
.ritratto { width: 150px; height: auto; margin: 0 0 16px;
            filter: drop-shadow(0 8px 10px rgba(6,40,63,.35)); }
h1 { font-family: "Arial Rounded MT Bold", "Trebuchet MS", Verdana, sans-serif;
     font-size: 2rem; line-height: 1.12; margin: 0 0 12px; color: #FFFFFF;
     text-shadow: 0 2px 0 rgba(6,40,63,.4); }
.sotto { font-size: 1.02rem; line-height: 1.5; color: #CFEAF6;
         margin: 0 0 24px; max-width: 24em; }
.console { width: 100%; background: rgba(255,255,255,.10); border-radius: 20px;
           border: 2px solid rgba(255,255,255,.22); padding: 16px; }
.console p { margin: 0 0 12px; font-size: .72rem; letter-spacing: .16em;
             text-transform: uppercase; font-weight: 700; color: var(--accento); }
audio { width: 100%; }
.dopo { width: 100%; background: #0E6B96; border-left: 6px solid var(--accento);
        border-radius: 14px; padding: 16px 18px; font-size: 1rem;
        line-height: 1.5; margin: 22px 0 0; text-align: left; }
.dopo b { color: #FFD166; }
.filo { width: 100%; margin: 18px 0 0; padding: 14px 18px; text-align: left;
        background: rgba(255,255,255,.07); border-radius: 14px;
        font-style: italic; font-size: 1rem; line-height: 1.55; }
.firma { display: flex; align-items: center; gap: 10px; margin: 18px 0 0;
         font-size: .82rem; color: #9FD6EA; text-align: left; }
.firma img { width: 40px; height: auto; flex: none; }
.crediti { margin-top: 26px; font-size: .72rem; line-height: 1.5;
           color: #7FB3C9; max-width: 26em; }
.crediti a { color: #7FB3C9; }
.manca { background: #FFD166; color: #0A2C3F; font-weight: 700;
         border-radius: 12px; padding: 12px 16px; margin-top: 22px;
         font-size: .84rem; }
.fondale { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; }
.fondale svg { display: block; width: 100%; height: auto; }
.bolle { position: fixed; top: 0; left: 0; right: 0; bottom: 0;
         pointer-events: none; overflow: hidden; }
.bolle i { position: absolute; bottom: -40px; border-radius: 50%;
           background: rgba(255,255,255,.14);
           border: 1px solid rgba(255,255,255,.28);
           animation: sale linear infinite; }
@keyframes sale { to { transform: translateY(-115vh); } }
@media (prefers-reduced-motion: reduce) { .bolle { display: none; } }
</style>
</head>
<body>
<div class="bolle" aria-hidden="true">
<i style="left:8%;width:13px;height:13px;animation-duration:21s;animation-delay:-2s"></i>
<i style="left:23%;width:8px;height:8px;animation-duration:16s;animation-delay:-9s"></i>
<i style="left:47%;width:17px;height:17px;animation-duration:26s;animation-delay:-14s"></i>
<i style="left:68%;width:10px;height:10px;animation-duration:19s;animation-delay:-5s"></i>
<i style="left:86%;width:14px;height:14px;animation-duration:23s;animation-delay:-17s"></i>
</div>
<div class="scafo">
<p class="capitolo">Le Piccole Meraviglie del Mare</p>
<img class="ritratto" src="totto.png" width="360" alt="Totto, il polpo capitano">
<h1>I suoni del libro</h1>
<p class="sotto">Queste pagine si aprono inquadrando i codici stampati sulle
pagine da colorare. Non c'è niente da cercare qui: il libro ti porta dove
devi andare.</p>
<p class="firma"><img class="" src="totto.png" width="360" alt="Totto, il polpo capitano"> Totto, il polpo capitano</p>
</div>

<g fill="none" stroke-linecap="round" stroke-width="7">

<path d="M520 112C512 96 528 88 520 72"/></g>

<ellipse cx="336" cy="58" rx="11" ry="7.5"/><path d="M325 58l-10-7v14z"/></g>
<g fill="#48CAE4" stroke="#3B1F28" stroke-width="2">
<ellipse cx="600" cy="44" rx="9" ry="6.5"/><path d="M609 44l9-6v12z"/></g>
</svg></div>
</body>
</html>
